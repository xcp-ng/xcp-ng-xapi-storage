# dm-multipath device tuning for DataCore SANsymphony "Virtual Disk" LUNs.
#
# Matches the recommended settings from DataCore's Linux (Proxmox) and
# XenServer Host Configuration Guides, with one deliberate XCP-ng
# convention preserved (see no_path_retry below).
#
# Without this file, the kernel's built-in default profile for
# `vendor "DataCore" / product "Virtual Disk"` applies — which is close,
# but omits rr_min_io_rq / fast_io_fail_tmo / dev_loss_tmo and uses
# `service-time 0` instead of DataCore's recommended `round-robin 0`.

devices {
    device {
        vendor                  "DataCore"
        product                 "Virtual Disk"
        path_checker            "tur"
        prio                    "alua"
        path_grouping_policy    "group_by_prio"
        path_selector           "round-robin 0"
        failback                "immediate"
        # DataCore recommends `fail` for no_path_retry — i.e., return EIO
        # immediately when all paths are down. XCP-ng's convention for
        # iSCSI SRs is `queue` (block I/O until a path returns) so VMs
        # survive transient outages at the cost of hanging forever if the
        # entire array goes away. We keep XCP-ng's convention.
        no_path_retry           "queue"
        rr_min_io_rq            "100"
        fast_io_fail_tmo        "5"
        dev_loss_tmo            "60"
    }
}
